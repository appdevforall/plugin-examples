name: Publish addons

on:
  workflow_dispatch:
    inputs:
      addon:
        description: One addon directory name, or "all"
        default: all
      staging:
        description: Publish under staging/ instead of the live keys
        type: boolean
        default: true

# This job holds the R2 write credentials and runs Gradle builds for every
# addon directory, so its token gets the least it can do its work with.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check names and metadata
        run: uv run --directory tools/addons addons --root "$GITHUB_WORKSPACE" check

      - name: Build, package, and stage
        id: stage
        env:
          ADDON: ${{ inputs.addon }}
        run: |
          set -euo pipefail
          mkdir -p dist
          all="$(uv run --directory tools/addons addons --root "$GITHUB_WORKSPACE" discover)"
          if [ "$ADDON" = "all" ]; then
            names="$all"
          else
            # resolve through discover so an unknown or hostile value cannot
            # reach the shell as a path
            names="$(printf '%s\n' "$all" | grep -Fx -e "$ADDON" -e "plugins/$ADDON" || true)"
            if [ -z "$names" ]; then
              echo "Unknown addon: $ADDON" >&2; exit 1
            fi
          fi
          printf 'only<<EOF\n%s\nEOF\n' "$names" >> "$GITHUB_OUTPUT"
          for dir in $names; do
            echo "==> $dir"
            ( cd "$dir"
              gradlew="$GITHUB_WORKSPACE/gradlew"
              if [ -x ./gradlew ]; then gradlew=./gradlew; fi
              if grep -q downloadAssets build.gradle.kts; then
                "$gradlew" --console=plain downloadAssets
              fi
              "$gradlew" --console=plain assemblePlugin )
            slug="$(basename "$dir" | tr '[:upper:]' '[:lower:]')"
            src="$(ls "$dir"/build/plugin/*.cgp | grep -v -- '-debug\.cgp$' | head -n1)"
            cp "$src" "dist/${slug}.cgp"
          done

      - name: Build the source tarballs
        env:
          ONLY: ${{ steps.stage.outputs.only }}
        run: |
          # shellcheck disable=SC2086
          uv run --directory tools/addons addons --root "$GITHUB_WORKSPACE" \
            tarball --out "$GITHUB_WORKSPACE/dist" --only $ONLY

      - name: Work out where this is being published
        id: dest
        env:
          STAGING: ${{ inputs.staging }}
        run: |
          prefix=""
          if [ "$STAGING" = "true" ]; then
            prefix="staging/${{ github.run_id }}/"
          fi
          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "base=https://addons.appdevforall.org/${prefix%/}" >> "$GITHUB_OUTPUT"

      - name: Generate the catalog
        env:
          BASE: ${{ steps.dest.outputs.base }}
          ONLY: ${{ steps.stage.outputs.only }}
          ADDONS_SOURCE_REF: ${{ github.ref_name }}
        run: |
          # shellcheck disable=SC2086
          uv run --directory tools/addons addons --root "$GITHUB_WORKSPACE" catalog \
            --dist "$GITHUB_WORKSPACE/dist" \
            --out "$GITHUB_WORKSPACE/dist/catalog.json" \
            --base "$BASE" --only $ONLY

      - name: Publish to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
          PREFIX: ${{ steps.dest.outputs.prefix }}
          BASE: ${{ steps.dest.outputs.base }}
          ONLY: ${{ steps.stage.outputs.only }}
        run: |
          # shellcheck disable=SC2086
          uv run --directory tools/addons addons --root "$GITHUB_WORKSPACE" publish \
            --dist "$GITHUB_WORKSPACE/dist" --prefix "$PREFIX" --only $ONLY
          {
            echo "### Published"
            echo "$BASE/index.html"
          } >> "$GITHUB_STEP_SUMMARY"
